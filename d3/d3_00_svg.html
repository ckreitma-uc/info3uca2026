<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="language" content="es">
        <meta name="description" content="D3.js SVG Circle Example">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0, user-scalable=yes">
        <style>
            circle {
                fill: hotpink;
                transition: r 3000ms, cy 600ms;
            }
            button:hover circle,
            button:focus-visible circle {
                r: 50px;
                cy: 100px;
            }
        </style>
        <title>D3 SVG Circle.js</title>
    </head>
    <body>
        <h1>SVG 00</h1>
        <button>
            <svg width="100" height="100">
                <circle r="30" cx="50" cy="50" />
            </svg>
        </button>
    </body>
    <script type="module"></script>
</html>
