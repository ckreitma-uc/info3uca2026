<!-- https://threejs.org/examples/#webgl_materials_lightmap -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <title>three.js webgl - materials - lightmap</title>
        <meta charset="utf-8">
        <meta name="viewport"
              content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <link type="text/css"
              rel="stylesheet"
              href="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r186/examples/main.css">
    </head>
    <body>
        <script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
					"three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
					"three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
				}
			}
        </script>
        <script type="module">

			import * as THREE from 'three/webgpu';

			import Stats from 'three/addons/libs/stats.module.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

			import { MeshBasicNodeMaterial } from 'three/webgpu';
			import { vec4, color, positionLocal, mix } from 'three/tsl';

			let container, stats;
			let camera, scene, renderer;

			init().then( animate );

			async function init() {

				const { innerWidth, innerHeight } = window;

				container = document.createElement( 'div' );
				document.body.appendChild( container );

				// CAMERA

				camera = new THREE.PerspectiveCamera( 40, innerWidth / innerHeight, 1, 10000 );
				camera.position.set( 700, 200, - 500 );

				// SCENE

				scene = new THREE.Scene();

				// LIGHTS

				const light = new THREE.DirectionalLight( 0xd5deff );
				light.position.x = 300;
				light.position.y = 250;
				light.position.z = - 500;
				scene.add( light );

				// SKYDOME

				const topColor = new THREE.Color().copy( light.color );
				const bottomColor = new THREE.Color( 0xffffff );
				const offset = 400;
				const exponent = 0.6;

				const h = positionLocal.add( offset ).normalize().y;

				const skyMat = new MeshBasicNodeMaterial();
				skyMat.colorNode = vec4( mix( color( bottomColor ), color( topColor ), h.max( 0.0 ).pow( exponent ) ), 1.0 );
				skyMat.side = THREE.BackSide;

				const sky = new THREE.Mesh( new THREE.SphereGeometry( 4000, 32, 15 ), skyMat );
				scene.add( sky );

				// RENDERER

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( innerWidth, innerHeight );
				await renderer.init();
				container.appendChild( renderer.domElement );

				// CONTROLS

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.maxPolarAngle = 0.9 * Math.PI / 2;
				controls.enableZoom = false;

				// STATS

				stats = new Stats();
				container.appendChild( stats.dom );

				// MODEL

				const manager = new THREE.LoadingManager();
				manager.setURLModifier( url => {
					const asset = url.split( '/' ).pop();
					if ( asset === 'lightmap-ao-shadow.png' || asset === 'rocks.jpg' || asset === 'stone.jpg' ) {
						return `https://raw.githubusercontent.com/mrdoob/three.js/r186/examples/models/json/lightmap/${asset}`;
					}
					return url;
				} );
				const loader = new THREE.ObjectLoader( manager );
				const object = await loader.loadAsync( './threejs/models/json/lightmap.json' );
				scene.add( object );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function animate() {

				requestAnimationFrame( animate );

				renderer.render( scene, camera );
				stats.update();

			}

        </script>
    </body>
</html>
