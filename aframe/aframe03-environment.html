<!DOCTYPE html>
<html lang="es">
    <head>
        <meta name="language" content="en">
        <meta charset="utf-8">
        <meta name="description" content="Three.js fundamentals with animation">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0, user-scalable=yes">
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
        <style>
        .overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            color: white;
  }
        </style>
        <title>AFrame - Tutorial 03</title>
    </head>
    <body>
        <a-scene>
            <a-assets>
                <img id="groundTexture"
                     alt="Piso"
                     src="https://cdn.aframe.io/a-painter/images/floor.jpg">
            </a-assets>
            <a-entity text="value: Hello, A-Frame with environment; color: orange; width: 5; anchor: align" position="-0.9 0.8 -3" scale="1.5 1.5 1.5"></a-entity>
                <a-box color="red" position="0 2 -5" scale="2 2 2" rotation="0 45 45"></a-box>
                    <a-sky color="#CCDDFF"></a-sky>
                        <a-plane src="#groundTexture" rotation="-90 0 0" width="30" height="30" repeat="10 10"></a-plane>
                        </a-scene>
                        <div class="overlay">
                            <a href="https://aframe.io/docs/1.8.0/guides/building-a-basic-scene.html"
                               target="_blank">Tutorial 03 - Obtenido de A-Frame Building a Basic Scene</a>
                        </div>
                    </body>
                </html>
